  <script>
    // Redirect by browser language instead of always forcing Russian, so
    // English/Georgian/Vietnamese visitors land on their own page. Anyone
    // without JS (or a crawler that doesn't run it) just sees the picker
    // above instead of being stuck — a real fallback, not a dead link.
    (function () {
      var langs = (navigator.languages || [navigator.language || ""]).map(function (l) {
        return l.toLowerCase();
      });
      var supported = ["ru", "ka", "vi", "en"];
      for (var i = 0; i < langs.length; i++) {
        for (var j = 0; j < supported.length; j++) {
          if (langs[i].indexOf(supported[j]) === 0) {
            window.location.replace(supported[j] + ".html");
            return;
          }
        }
      }
      window.location.replace("en.html");
    })();
